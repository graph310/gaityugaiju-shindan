<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>害虫・害獣お悩み診断｜その虫、放置して大丈夫？</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-dark: #1A5C2A;
      --green-mid: #2E8B3E;
      --green-light: #E8F5EA;
      --orange: #E8720C;
      --orange-light: #FFF3E8;
      --yellow: #F5C842;
      --white: #FFFFFF;
      --bg: #F5F9F5;
      --text: #1A2E1A;
      --gray: #6B7280;
      --border: #C8E0CC;
      --pink: #E8356D;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); font-family: 'Noto Sans JP', sans-serif; min-height: 100vh; }

    /* HERO */
    .hero { position: relative; max-width: 480px; margin: 0 auto; overflow: hidden; }
    .hero-img { width: 100%; display: block; }
    .hero-btn-overlay {
      position: absolute; bottom: 13%;
      left: 0; right: 0; width: 100%; z-index: 10;
    }
    .start-btn {
      background: transparent; color: transparent; border: none;
      padding: 0; cursor: pointer; width: 100%;
      height: calc(100vw * 0.13); display: block; max-height: 62px;
      -webkit-tap-highlight-color: transparent;
    }

    /* MAIN */
    main { max-width: 480px; margin: 0 auto; padding: 0 16px 60px; }

    /* BRANCH SELECTION */
    .branch-section { padding: 24px 0; }
    .branch-title { text-align: center; font-size: 16px; font-weight: 900; color: var(--green-dark); margin-bottom: 16px; }
    .branch-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .branch-card {
      background: var(--white); border-radius: 12px; padding: 20px 12px;
      text-align: center; cursor: pointer; border: 2px solid var(--border);
      transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .branch-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
    .branch-card.insect { border-color: var(--green-mid); }
    .branch-card.insect:hover { background: var(--green-light); }
    .branch-card.risk { border-color: var(--pink); }
    .branch-card.risk:hover { background: #FFF0F5; }
    .branch-icon { font-size: 40px; margin-bottom: 8px; display: block; }
    .branch-label-sub { font-size: 11px; color: var(--gray); margin-bottom: 4px; }
    .branch-label-main { font-size: 15px; font-weight: 900; color: var(--text); margin-bottom: 12px; display: block; }
    .branch-label-main.green { color: var(--green-dark); }
    .branch-label-main.pink { color: var(--pink); }
    .branch-btn {
      display: block; width: 100%; padding: 10px;
      border: none; border-radius: 8px; font-family: 'Noto Sans JP', sans-serif;
      font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s;
    }
    .branch-btn.green { background: var(--green-mid); color: var(--white); }
    .branch-btn.pink { background: var(--pink); color: var(--white); }

    /* PROGRESS */
    .progress-wrap { padding: 20px 0 14px; }
    .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .progress-step { font-size: 13px; font-weight: 700; color: var(--green-dark); }
    .progress-track { height: 5px; background: var(--border); border-radius: 99px; }
    .progress-fill { height: 5px; background: linear-gradient(90deg, var(--green-dark), var(--green-mid)); border-radius: 99px; transition: width 0.4s ease; }

    /* QUESTION CARD */
    .q-card {
      background: var(--white); border-radius: 10px; padding: 24px 20px;
      box-shadow: 0 2px 12px rgba(26,92,42,0.1); border: 1px solid var(--border);
      animation: fadeUp 0.4s ease both;
    }
    .q-category {
      font-size: 11px; font-weight: 700; letter-spacing: 0.2em;
      color: var(--green-mid); background: var(--green-light);
      padding: 3px 10px; border-radius: 4px;
      display: inline-block; margin-bottom: 12px;
    }
    .q-text { font-size: 17px; font-weight: 900; color: var(--text); line-height: 1.5; margin-bottom: 18px; }
    .multi-hint { font-size: 12px; color: var(--gray); margin-bottom: 12px; }
    .options { display: flex; flex-direction: column; gap: 9px; }
    .opt-btn {
      background: var(--white); border: 2px solid var(--border);
      border-radius: 8px; padding: 13px 15px;
      font-family: 'Noto Sans JP', sans-serif; font-size: 14px; font-weight: 500;
      color: var(--text); cursor: pointer; text-align: left;
      transition: all 0.15s; display: flex; align-items: center; gap: 10px;
    }
    .opt-btn:hover { border-color: var(--green-mid); background: var(--green-light); }
    .opt-btn.selected { border-color: var(--green-dark); background: var(--green-light); color: var(--green-dark); font-weight: 700; }
    .opt-mark {
      width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid var(--border); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: var(--gray); background: var(--bg);
    }
    .opt-btn.selected .opt-mark { background: var(--green-dark); color: var(--white); border-color: var(--green-dark); }
    .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
    .back-btn {
      background: transparent; border: 2px solid var(--border); border-radius: 6px;
      padding: 11px 20px; font-family: 'Noto Sans JP', sans-serif;
      font-size: 13px; font-weight: 700; color: var(--gray); cursor: pointer;
    }
    .next-btn {
      background: var(--green-dark); border: none; border-radius: 6px;
      padding: 13px 28px; font-family: 'Noto Sans JP', sans-serif;
      font-size: 14px; font-weight: 900; color: var(--white);
      cursor: pointer; opacity: 0.3; pointer-events: none; transition: all 0.15s;
    }
    .next-btn.active { opacity: 1; pointer-events: auto; }

    /* LOADING */
    .loading { text-align: center; padding: 56px 0; }
    .loading-ring {
      width: 52px; height: 52px;
      border: 4px solid var(--border); border-top-color: var(--green-dark);
      border-radius: 50%; margin: 0 auto 20px;
      animation: spin 0.9s linear infinite;
    }
    .loading-text { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 20px; }
    .loading-steps { display: flex; flex-direction: column; gap: 10px; max-width: 260px; margin: 0 auto; }
    .loading-step { font-size: 13px; color: var(--border); text-align: left; opacity: 0; transition: all 0.5s; display: flex; align-items: center; gap: 8px; }
    .loading-step.show { opacity: 1; color: var(--gray); }
    .loading-step.done { color: var(--green-dark); font-weight: 700; }
    .step-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

    /* RESULT */
    .result-hero {
      background: linear-gradient(135deg, var(--green-dark), var(--green-mid));
      padding: 28px 20px; text-align: center;
      border-radius: 10px; margin-top: 20px; margin-bottom: 14px;
    }
    .result-label { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; color: var(--yellow); display: block; margin-bottom: 8px; }
    .result-type { font-size: 20px; font-weight: 900; color: var(--white); line-height: 1.4; margin-bottom: 6px; }
    .result-sub { font-size: 13px; color: rgba(255,255,255,0.8); line-height: 1.6; }

    .card {
      background: var(--white); border-radius: 10px;
      padding: 22px 18px; margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(26,92,42,0.08);
      border: 1px solid var(--border);
    }
    .card-title {
      font-size: 12px; font-weight: 700; letter-spacing: 0.15em;
      color: var(--green-mid); border-left: 4px solid var(--green-mid);
      padding-left: 10px; margin-bottom: 14px;
    }
    .result-comment { font-size: 14px; color: var(--gray); line-height: 1.7; }

    /* CTA */
    .cta-card {
      border-radius: 12px; padding: 24px 18px; margin-bottom: 12px;
      background: linear-gradient(135deg, var(--green-dark), var(--green-mid));
    }
    .cta-label { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; color: var(--yellow); display: block; margin-bottom: 6px; }
    .cta-title { font-size: 18px; font-weight: 900; color: var(--white); margin-bottom: 8px; line-height: 1.4; }
    .cta-desc { font-size: 13px; color: rgba(255,255,255,0.85); line-height: 1.7; margin-bottom: 18px; }
    .cta-btn {
      display: flex; align-items: center; justify-content: center;
      background: var(--orange); color: var(--white);
      border: none; border-radius: 10px; padding: 16px;
      font-family: 'Noto Sans JP', sans-serif; font-size: 16px; font-weight: 900;
      cursor: pointer; width: 100%; text-decoration: none;
      transition: all 0.2s; gap: 8px;
    }
    .cta-btn:hover { background: #C5600A; transform: translateY(-1px); }
    .cta-note { font-size: 11px; color: rgba(255,255,255,0.6); text-align: center; margin-top: 10px; }

    .retry-link { text-align: center; margin-top: 14px; }
    .retry-link a { font-size: 13px; color: var(--gray); text-decoration: underline; cursor: pointer; }

    /* RISK RESULT */
    .risk-badge {
      width: 80px; height: 80px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 900; margin: 0 auto 12px;
      border: 3px solid;
    }
    .risk-badge.high { background: #FFEBEE; color: #C62828; border-color: #C62828; }
    .risk-badge.mid { background: #FFF8E1; color: #F57F17; border-color: #F57F17; }
    .risk-badge.low { background: #E8F5E9; color: #2E7D32; border-color: #2E7D32; }
    .risk-label { text-align: center; font-size: 18px; font-weight: 900; margin-bottom: 8px; }
    .risk-comment { font-size: 14px; color: var(--gray); line-height: 1.7; }

    .hidden { display: none !important; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- HERO -->
<div class="hero" id="hero-section">
  <img class="hero-img" src="img/fv_bg.jpg" alt="害虫・害獣お悩み診断">
  <div class="hero-btn-overlay">
    <button class="start-btn" onclick="showBranch()"></button>
  </div>
</div>

<main>
  <!-- BRANCH -->
  <section class="hidden branch-section" id="branch-section">
    <div class="branch-title">まずは状況を教えてください</div>
    <div class="branch-cards">
      <div class="branch-card insect" onclick="startQuiz('insect')">
        <span class="branch-icon">🔍</span>
        <span class="branch-label-sub">今、害虫・害獣を</span>
        <span class="branch-label-main green">見かけている</span>
        <button class="branch-btn green">害虫・害獣特定チャートへ →</button>
      </div>
      <div class="branch-card risk" onclick="startQuiz('risk')">
        <span class="branch-icon">🏠</span>
        <span class="branch-label-sub">見かけていないけど</span>
        <span class="branch-label-main pink">不安がある</span>
        <button class="branch-btn pink">リスク診断へ →</button>
      </div>
    </div>
  </section>

  <!-- QUIZ -->
  <section class="hidden" id="quiz-section">
    <div class="progress-wrap">
      <div class="progress-header">
        <span class="progress-step" id="prog-step">STEP 1 / 4</span>
        <span class="progress-step" id="prog-pct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="prog-fill" style="width:0%"></div>
      </div>
    </div>
    <div class="q-card" id="q-card">
      <div class="q-category" id="q-category"></div>
      <div class="q-text" id="q-text"></div>
      <div class="multi-hint hidden" id="multi-hint">複数選択できます</div>
      <div class="options" id="q-opts"></div>
      <div class="nav-row">
        <button class="back-btn" id="back-btn" onclick="prevQ()">← 戻る</button>
        <button class="next-btn" id="next-btn" onclick="nextQ()">次へ →</button>
      </div>
    </div>
  </section>

  <!-- LOADING -->
  <section class="hidden loading" id="loading-section">
    <div class="loading-ring"></div>
    <div class="loading-text">診断中…</div>
    <div class="loading-steps">
      <div class="loading-step" id="ls1"><span class="step-dot"></span>回答データを確認</div>
      <div class="loading-step" id="ls2"><span class="step-dot"></span>害虫・害獣の種類を特定</div>
      <div class="loading-step" id="ls3"><span class="step-dot"></span>リスクレベルを判定</div>
      <div class="loading-step" id="ls4"><span class="step-dot"></span>対応策を算出</div>
    </div>
  </section>

  <!-- RESULT -->
  <section class="hidden" id="result-section">
    <div class="result-hero">
      <span class="result-label">診断結果</span>
      <div class="result-type" id="res-type"></div>
      <div class="result-sub" id="res-sub"></div>
    </div>
    <div class="card">
      <div class="card-title">状況分析</div>
      <div id="res-risk-badge-wrap"></div>
      <div class="result-comment" id="res-comment"></div>
    </div>
    <div class="cta-card">
      <span class="cta-label">おすすめの対応</span>
      <div class="cta-title" id="cta-title"></div>
      <div class="cta-desc" id="cta-desc"></div>
      <a id="cta-btn" href="#" target="_blank" class="cta-btn">
        <span id="cta-btn-text">無料で相談する</span>
      </a>
      <p class="cta-note">※現地調査・見積もり無料・キャンセル無料</p>
    </div>
    <div class="retry-link">
      <a onclick="goTop()">もう一度診断する</a>
    </div>
  </section>
</main>

<script>
// 害虫特定チャートの質問
const insectQuestions = [
  {
    id: "type",
    category: "Q1 / 種類",
    text: "今気になっているのは？",
    type: "single",
    options: ["虫（ゴキブリ・ハチ・シロアリ等）", "獣（ネズミ・イタチ・ハクビシン等）", "わからない"],
    scores: [0, 1, 0]
  },
  {
    id: "location",
    category: "Q2 / 発見場所",
    text: "どこで見かけましたか？",
    type: "single",
    options: ["キッチン・浴室・トイレ", "リビング・寝室・クローゼット", "軒下・庭・玄関まわり", "天井裏・床下・壁の中"],
    scores: [0, 0, 0, 1]
  },
  {
    id: "symptom",
    category: "Q3 / 状況",
    text: "状況に近いものを選んでください",
    type: "single",
    options: [
      "黒くて素早く動く虫がいる（夜中に出てくる）",
      "軒下や壁の穴からハチが出入りしている",
      "木くずのようなものが落ちている・白い虫がいる",
      "ペットや体が痒い・小さく跳ねる虫を見た",
      "ベッドや畳の隙間に黒い点がある・噛まれて猛烈に痒い",
      "天井裏でゴソゴソ・カサカサ音がする",
      "キッチンや畑に噛み跡・フンがある"
    ],
    scores: [0, 0, 0, 0, 0, 1, 1]
  },
  {
    id: "urgency",
    category: "Q4 / 緊急度",
    text: "今の状況は？",
    type: "single",
    options: ["今すぐ何とかしたい", "まず無料見積もりだけ聞きたい", "相談だけしたい"],
    scores: [2, 1, 0]
  }
];

// リスク診断の質問
const riskQuestions = [
  {
    id: "home",
    category: "Q1 / 住環境",
    text: "お住まいは？",
    type: "single",
    options: ["戸建て（築10年未満）", "戸建て（築10年以上）", "マンション・アパート"],
    scores: [5, 15, 8]
  },
  {
    id: "symptoms",
    category: "Q2 / 気になる症状",
    text: "気になることはありますか？（複数選択可）",
    type: "multi",
    options: [
      "天井や壁からゴソゴソ・カサカサ音がする",
      "キッチンや押し入れに噛み跡・フンがある",
      "庭や畑が荒らされている気がする",
      "以前に害虫・害獣が出たことがある",
      "近所で害虫・害獣の話を聞いた"
    ],
    scores: [20, 20, 15, 10, 5]
  },
  {
    id: "duration",
    category: "Q3 / 気になり始めた時期",
    text: "いつ頃から気になっていますか？",
    type: "single",
    options: ["最近気づいた", "1ヶ月以上前から", "半年以上前から"],
    scores: [5, 10, 15]
  }
];

// 害虫種類判定
const insectTypes = {
  0: { name: "ゴキブリ", type: "insect" },
  1: { name: "ハチ・スズメバチ", type: "insect" },
  2: { name: "シロアリ", type: "insect" },
  3: { name: "ノミ・ダニ", type: "insect" },
  4: { name: "トコジラミ", type: "insect" },
  5: { name: "ネズミ・害獣", type: "gaiju" },
  6: { name: "ネズミ・害獣", type: "gaiju" }
};

const GAICHU_URL = "https://aff.life-110.com/?st_site=gaichu";
const GAIJU_URL = "https://aff.life-110.com/?st_site=gaiju&st_aff=a8";

let currentMode = 'insect';
let cur = 0;
let answers = {};
let multiSelections = [];

function showBranch() {
  document.getElementById('hero-section').classList.add('hidden');
  document.getElementById('branch-section').classList.remove('hidden');
  window.scrollTo({top:0, behavior:'smooth'});
}

function startQuiz(mode) {
  currentMode = mode;
  cur = 0;
  answers = {};
  multiSelections = [];
  document.getElementById('branch-section').classList.add('hidden');
  document.getElementById('quiz-section').classList.remove('hidden');
  window.scrollTo({top:0, behavior:'smooth'});
  renderQ();
}

function getQuestions() {
  return currentMode === 'insect' ? insectQuestions : riskQuestions;
}

function renderQ() {
  const questions = getQuestions();
  const q = questions[cur];
  const total = questions.length;

  document.getElementById('q-category').textContent = q.category;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('prog-step').textContent = `STEP ${cur+1} / ${total}`;
  const pct = Math.round((cur / total) * 100);
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';

  const mh = document.getElementById('multi-hint');
  q.type === 'multi' ? mh.classList.remove('hidden') : mh.classList.add('hidden');
  if (q.type === 'multi') multiSelections = answers[cur] ? [...answers[cur]] : [];

  document.getElementById('back-btn').style.visibility = cur === 0 ? 'hidden' : 'visible';

  const opts = document.getElementById('q-opts');
  opts.innerHTML = '';
  const nextBtn = document.getElementById('next-btn');
  nextBtn.classList.remove('active');

  const labels = ['A','B','C','D','E','F','G'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    if (q.type === 'single' && answers[cur] === i) btn.classList.add('selected');
    if (q.type === 'multi' && multiSelections.includes(i)) btn.classList.add('selected');
    btn.innerHTML = `<span class="opt-mark">${labels[i]}</span>${opt}`;
    btn.onclick = () => {
      if (q.type === 'single') {
        answers[cur] = i;
        document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        nextBtn.classList.add('active');
      } else {
        const idx = multiSelections.indexOf(i);
        idx > -1 ? multiSelections.splice(idx, 1) : multiSelections.push(i);
        btn.classList.toggle('selected');
        answers[cur] = multiSelections.length > 0 ? [...multiSelections] : null;
        nextBtn.classList[multiSelections.length > 0 ? 'add' : 'remove']('active');
      }
    };
    opts.appendChild(btn);
  });

  if (q.type === 'multi') {
    if (multiSelections.length > 0) nextBtn.classList.add('active');
  } else {
    if (answers[cur] !== undefined && answers[cur] !== null) nextBtn.classList.add('active');
  }

  document.getElementById('q-card').style.animation = 'none';
  void document.getElementById('q-card').offsetWidth;
  document.getElementById('q-card').style.animation = 'fadeUp 0.4s ease both';
}

function nextQ() {
  const questions = getQuestions();
  if (cur < questions.length - 1) { cur++; renderQ(); }
  else { showLoading(); }
}

function prevQ() {
  if (cur > 0) { cur--; renderQ(); }
  else {
    document.getElementById('quiz-section').classList.add('hidden');
    document.getElementById('branch-section').classList.remove('hidden');
  }
}

function goTop() {
  document.getElementById('hero-section').classList.remove('hidden');
  document.getElementById('branch-section').classList.add('hidden');
  document.getElementById('quiz-section').classList.add('hidden');
  document.getElementById('loading-section').classList.add('hidden');
  document.getElementById('result-section').classList.add('hidden');
  window.scrollTo({top:0, behavior:'smooth'});
}

function showLoading() {
  document.getElementById('quiz-section').classList.add('hidden');
  document.getElementById('loading-section').classList.remove('hidden');
  ['ls1','ls2','ls3','ls4'].forEach((id, i) => {
    setTimeout(() => {
      document.getElementById(id).classList.add('show');
      if (i > 0) document.getElementById(['ls1','ls2','ls3','ls4'][i-1]).classList.add('done');
    }, i * 750);
  });
  setTimeout(showResult, 3400);
}

function showResult() {
  document.getElementById('loading-section').classList.add('hidden');
  document.getElementById('result-section').classList.remove('hidden');
  window.scrollTo({top:0, behavior:'smooth'});

  if (currentMode === 'insect') {
    showInsectResult();
  } else {
    showRiskResult();
  }
}

function showInsectResult() {
  // Q1で獣を選んだ or Q3で音・噛み跡系を選んだ → 害獣
  const q1 = answers[0]; // 0=虫, 1=獣, 2=わからない
  const q3 = answers[2]; // 症状

  let pestType = 'insect';
  let pestName = '害虫';

  if (q1 === 1) {
    pestType = 'gaiju';
    pestName = '害獣（ネズミ・イタチ等）';
  } else if (q3 !== undefined) {
    const symptomInfo = insectTypes[q3];
    if (symptomInfo) {
      pestName = symptomInfo.name;
      pestType = symptomInfo.type;
    }
  }

  const isGaiju = pestType === 'gaiju';

  document.getElementById('res-type').textContent = `${pestName}の可能性が高いです`;
  document.getElementById('res-sub').textContent = '早めの対処が被害の拡大を防ぎます。';
  document.getElementById('res-risk-badge-wrap').innerHTML = '';

  const urgency = answers[3];
  let comment = '';
  if (urgency === 0) {
    comment = '今すぐの対応が必要な状況です。放置すると被害が広がる可能性があります。プロへの相談をおすすめします。';
  } else if (urgency === 1) {
    comment = 'まずは無料見積もりから始めましょう。現地調査・見積もりは完全無料なので、気軽にご相談ください。';
  } else {
    comment = '相談だけでも大丈夫です。専門家に状況を伝えることで、適切な対処法が見えてきます。';
  }
  document.getElementById('res-comment').textContent = comment;

  if (isGaiju) {
    document.getElementById('cta-title').textContent = '害獣駆除110番に無料相談する';
    document.getElementById('cta-desc').textContent = 'ネズミ・イタチ・ハクビシンなど害獣のプロが対応。見積もり・キャンセル無料、24時間365日受付。上場企業運営の安心サービスです。';
    document.getElementById('cta-btn').href = GAIJU_URL;
    document.getElementById('cta-btn-text').textContent = '害獣駆除110番に無料相談する';
  } else {
    document.getElementById('cta-title').textContent = '害虫駆除110番に無料相談する';
    document.getElementById('cta-desc').textContent = 'ゴキブリ・ハチ・シロアリ等の害虫駆除のプロが対応。見積もり無料、最短30分で現地調査。24時間365日受付中です。';
    document.getElementById('cta-btn').href = GAICHU_URL;
    document.getElementById('cta-btn-text').textContent = '害虫駆除110番に無料相談する';
  }
}

function showRiskResult() {
  // リスクスコア計算
  let score = 0;
  if (answers[0] !== undefined) score += riskQuestions[0].scores[answers[0]];
  if (Array.isArray(answers[1])) answers[1].forEach(i => score += riskQuestions[1].scores[i]);
  if (answers[2] !== undefined) score += riskQuestions[2].scores[answers[2]];

  let riskLevel, riskClass, riskText, comment;
  if (score >= 35) {
    riskLevel = '要注意'; riskClass = 'high';
    riskText = 'リスクが高い状態です';
    comment = '複数の気になるサインが見られます。放置すると被害が大きくなる可能性があります。早めにプロへ相談することをおすすめします。';
  } else if (score >= 20) {
    riskLevel = '注意'; riskClass = 'mid';
    riskText = 'リスクが中程度です';
    comment = '気になるサインがいくつか見られます。現時点では深刻ではないかもしれませんが、早めの確認が安心です。';
  } else {
    riskLevel = '問題なし'; riskClass = 'low';
    riskText = '現時点では低リスクです';
    comment = '今すぐ深刻な状況ではないようです。ただし、定期的な点検や予防対策を続けることで、害虫・害獣の発生を防げます。';
  }

  document.getElementById('res-type').textContent = riskText;
  document.getElementById('res-sub').textContent = '診断結果をもとに適切な対応をご提案します。';
  document.getElementById('res-risk-badge-wrap').innerHTML = `
    <div class="risk-badge ${riskClass}">${riskLevel}</div>
    <div class="risk-label" style="color:${riskClass==='high'?'#C62828':riskClass==='mid'?'#F57F17':'#2E7D32'}">${riskText}</div>
  `;
  document.getElementById('res-comment').textContent = comment;

  // Q2の症状から害獣か判定
  const symptoms = answers[1] || [];
  const hasGaijuSymptom = symptoms.includes(0) || symptoms.includes(1) || symptoms.includes(2);

  if (hasGaijuSymptom) {
    document.getElementById('cta-title').textContent = '害獣駆除110番に無料相談する';
    document.getElementById('cta-desc').textContent = '音・噛み跡・フンなど害獣のサインが見られます。まずは無料現地調査からご相談ください。見積もり・キャンセル無料です。';
    document.getElementById('cta-btn').href = GAIJU_URL;
    document.getElementById('cta-btn-text').textContent = '害獣駆除110番に無料相談する';
  } else {
    document.getElementById('cta-title').textContent = '害虫駆除110番に無料相談する';
    document.getElementById('cta-desc').textContent = '気になるサインがある場合は早めの確認が大切です。現地調査・見積もりは完全無料。24時間365日受付しています。';
    document.getElementById('cta-btn').href = GAICHU_URL;
    document.getElementById('cta-btn-text').textContent = '害虫駆除110番に無料相談する';
  }
}
